# Test configuration using H2 in-memory database with PostgreSQL compatibility

# Server Configuration
server.port=0

# Database Configuration (H2 in PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Configuration (disabled for tests - using create-drop)
spring.flyway.enabled=false

# Logging Configuration
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration
spring.security.user.name=test
spring.security.user.password=test

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Slack Configuration (enabled for tests)
slack.enabled=true
slack.signing-secret=test-signing-secret
slack.bot-token=xoxb-test-token

# Groq API Configuration (mock for tests - prevents real API calls)
groq.api.enabled=false
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=test-key-for-mocking-only
groq.api.model=llama-3.1-8b-instant
groq.api.timeout=1
groq.api.max-retries=1