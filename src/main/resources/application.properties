spring.application.name=leave-management

# Server Configuration
server.port=8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=true

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId:-}] [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId:-}] [%thread] %-5level %logger{36} - %msg%n

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/leave_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Batch Configuration
# Optimizes batch operations and reduces N+1 query problems
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security
spring.security.enabled=false

# Slack Configuration
# Slack signing secret for verifying requests from Slack
# Get this from your Slack app's Basic Information page
slack.signing-secret=${SLACK_SIGNING_SECRET:some-secret}

# Slack bot token for making API calls to Slack
# Get this from your Slack app's OAuth & Permissions page
# Should start with xoxb-
slack.bot-token=${SLACK_BOT_TOKEN:}

# Enable/disable Slack integration
slack.enabled=true

# Bulk Upload Configuration
# Directory where bulk upload result CSV files will be stored
bulk.upload.result-dir=${BULK_UPLOAD_RESULT_DIR:./bulk-upload-results}

# Leave Configuration
# Maximum number of optional holidays allowed per user per year
leave.max-optional-holidays-per-year=2

# GenAI Configuration
# Enable/disable GenAI features (AI-powered leave parsing)
genai.enabled=true

# Groq API Configuration
# Get your free API key from https://console.groq.com/
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.1-8b-instant
groq.api.timeout=30
groq.api.connect-timeout=5000
groq.api.read-timeout=30000
groq.api.write-timeout=30000
groq.api.max-retries=2
